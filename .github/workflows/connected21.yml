          /** Themed canvas with two soft colour glows, used behind the main screen. */
          fun Modifier.c21Aurora(
              dark: Boolean,
              base: Color,
              glow1: Color,
              glow2: Color,
              strength: Float
          ): Modifier = this.drawBehind {
              drawRect(base)
              if (strength <= 0f) return@drawBehind
              val a1 = (if (dark) 0.38f else 0.16f) * strength
              val a2 = (if (dark) 0.26f else 0.12f) * strength
              val r1 = size.width * 0.95f
              val c1 = Offset(size.width * 0.12f, size.height * 0.02f)
              drawCircle(
                  brush = Brush.radialGradient(
                      colors = listOf(glow1.copy(alpha = a1), Color.Transparent),
                      center = c1,
                      radius = r1
                  ),
                  radius = r1,
                  center = c1
              )
              val r2 = size.width * 0.9f
              val c2 = Offset(size.width * 0.95f, size.height * 0.78f)
              drawCircle(
                  brush = Brush.radialGradient(
                      colors = listOf(glow2.copy(alpha = a2), Color.Transparent),
                      center = c2,
                      radius = r2
                  ),
                  radius = r2,
                  center = c2
              )
          }

          /**
           * Thin animated line that travels around a server card.
           * Green when the server has a ping result, red when it has none or failed.
           */
          fun Modifier.c21PingBorder(delayMillis: Long): Modifier = composed {
              val ok = delayMillis > 0L
              val color = if (ok) C21Mint else Color(0xFFFF4D6D)
              val transition = rememberInfiniteTransition(label = "c21-border")
              val progress = transition.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(durationMillis = if (ok) 3600 else 2400, easing = LinearEasing),
                      repeatMode = RepeatMode.Restart
                  ),
                  label = "c21-border-progress"
              )
              this.drawWithContent {
                  drawContent()
                  val stroke = 2.dp.toPx()
                  val half = stroke / 2f
                  val radius = 18.dp.toPx() - half
                  val rect = RoundRect(
                      left = half,
                      top = half,
                      right = size.width - half,
                      bottom = size.height - half,
                      cornerRadius = CornerRadius(radius, radius)
                  )
                  // faint full outline
                  drawRoundRect(
                      color = color.copy(alpha = 0.30f),
                      topLeft = Offset(half, half),
                      size = androidx.compose.ui.geometry.Size(size.width - stroke, size.height - stroke),
                      cornerRadius = CornerRadius(radius, radius),
                      style = Stroke(width = stroke)
                  )
                  // travelling highlight
                  val path = Path().apply { addRoundRect(rect) }
                  val measure = PathMeasure()
                  measure.setPath(path, false)
                  val length = measure.length
                  if (length > 0f) {
                      val start = progress.value * length
                      val end = start + length * 0.16f
                      val segment = Path()
                      if (end <= length) {
                          measure.getSegment(start, end, segment, true)
                      } else {
                          measure.getSegment(start, length, segment, true)
                          measure.getSegment(0f, end - length, segment, true)
                      }
                      drawPath(
                          path = segment,
                          color = color,
                          style = Stroke(width = stroke * 1.6f, cap = StrokeCap.Round)
                      )
                  }
              }
          }

