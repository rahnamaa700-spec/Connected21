name: Build Connected21 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain > build.log 2>&1 || { grep -n -E "^e: |error:|What went wrong|FAILED|Execution failed" -A6 build.log | head -80; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Connected21-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
