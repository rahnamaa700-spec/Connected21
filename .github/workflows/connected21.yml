          cat > "$D/apply_c21.py" <<'C21_EOF'
          import pathlib
          import re
          import shutil
          import sys

          SRC = pathlib.Path(sys.argv[1])
          APP = pathlib.Path("V2rayNG/app")
          MAIN = APP / "src/main"
          UI = MAIN / "java/com/v2ray/ang/ui"
          RES = MAIN / "res"


          def rd(p):
              return p.read_text(encoding="utf-8")


          def wr(p, s):
              p.write_text(s, encoding="utf-8")


          def sub(path, old, new, count=1):
              s = rd(path)
              found = s.count(old)
              if found != count:
                  sys.exit("PATCH FAILED in %s: expected %d match(es), found %d for:\n%s" % (path, count, found, old))
              wr(path, s.replace(old, new))
              print("patched", path)


          def add_imports(path, imports):
              s = rd(path)
              m = re.search(r"^package .*$", s, re.M)
              if not m:
                  sys.exit("no package line in %s" % path)
              block = "\n" + "\n".join("import " + i for i in imports)
              wr(path, s[: m.end()] + block + s[m.end():])


          def put(src_name, dest):
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(SRC / src_name, dest)
              print("wrote", dest)


          # 1) whole-file replacements and new files
          put("Theme.kt", UI / "compose/Theme.kt")
          put("MainBottomBar.kt", UI / "main/MainBottomBar.kt")
          put("MainDrawer.kt", UI / "main/MainDrawer.kt")
          put("Connected21UI.kt", UI / "main/Connected21UI.kt")
          put("c21_icon_bg.xml", RES / "drawable/c21_icon_bg.xml")
          put("c21_fg.xml", RES / "drawable/c21_fg.xml")
          put("ic_launcher_adaptive.xml", RES / "mipmap-anydpi-v26/ic_launcher.xml")
          put("ic_launcher_adaptive.xml", RES / "mipmap-anydpi-v26/ic_launcher_round.xml")

          # 2) name and package id
          sub(RES / "values/strings.xml",
              '<string name="app_name" translatable="false">v2rayNG</string>',
              '<string name="app_name" translatable="false">Connected21</string>')
          sub(APP / "build.gradle.kts", 'applicationId = "com.v2ray.ang"',
              'applicationId = "com.v2ray.ang.connected21"')
          sub(RES / "xml/shortcuts.xml", 'android:targetPackage="com.v2ray.ang"',
              'android:targetPackage="com.v2ray.ang.connected21"', count=4)

          # 3) main screen: aurora background, sponsor popup, banner, quick start
          ms = UI / "main/MainScreen.kt"
          sub(ms, "    ModalNavigationDrawer(\n        drawerState = drawerState,",
              "    C21SponsorPopup()\n\n    ModalNavigationDrawer(\n        drawerState = drawerState,")
          sub(ms, "        Scaffold(\n            contentWindowInsets = ScaffoldDefaults.contentWindowInsets,",
              "        Scaffold(\n            modifier = Modifier.c21Aurora(\n"
              "                isDarkTheme,\n"
              "                MaterialTheme.colorScheme.background,\n"
              "                MaterialTheme.colorScheme.primary,\n"
              "                MaterialTheme.colorScheme.secondary,\n"
              "                LocalC21GlowAlpha.current\n"
              "            ),\n"
              "            containerColor = Color.Transparent,\n"
              "            contentWindowInsets = ScaffoldDefaults.contentWindowInsets,")
          sub(ms, "                ) {\n                    if (groups.size > 1) {",
              "                ) {\n                    C21SponsorBanner()\n                    C21ThemePicker()\n                    C21QuickStart()\n"
              "                    if (groups.size > 1) {")
          add_imports(ms, ["androidx.compose.ui.graphics.Color",
                           "androidx.compose.material3.MaterialTheme",
                           "com.v2ray.ang.ui.compose.LocalC21GlowAlpha"])

          # 4) top bar: brand title + transparent bar
          sub(UI / "main/MainTopBar.kt", "title = stringResource(R.string.title_server),",
              "title = stringResource(R.string.app_name),")
          comp = UI / "compose/Components.kt"
          sub(comp, "                containerColor = MaterialTheme.colorScheme.surface,\n                titleContentColor",
              "                containerColor = Color.Transparent,\n                titleContentColor")
          sub(comp, "fun ItemDivider() {\n    AppDivider(modifier = Modifier.padding(horizontal = 12.dp))\n}",
              "fun ItemDivider() {\n}")

          # 5) server rows become cards
          pager = UI / "main/MainServerPager.kt"
          sub(pager,
              "    Row(\n        modifier = Modifier\n            .fillMaxWidth()\n            .height(IntrinsicSize.Min)\n            .semantics {",
              "    Row(\n        modifier = Modifier\n            .fillMaxWidth()\n"
              "            .padding(horizontal = 12.dp, vertical = 5.dp)\n"
              "            .clip(RoundedCornerShape(18.dp))\n"
              "            .background(\n"
              "                if (isSelected) MaterialTheme.colorScheme.primary.copy(alpha = 0.16f)\n"
              "                else MaterialTheme.colorScheme.surfaceContainer\n"
              "            )\n"
              "            .c21PingBorder(row.testDelayMillis)\n"
              "            .height(IntrinsicSize.Min)\n            .semantics {")
          add_imports(pager, ["androidx.compose.foundation.border",
                              "androidx.compose.foundation.shape.RoundedCornerShape"])

          # 6) promotion entry opens the sponsor channel instead of a third-party page
          sub(UI / "main/MainActivity.kt",
              '                Utils.openUri(\n                    this,\n'
              '                    "${Utils.decode(AppConfig.APP_PROMOTION_URL)}?t=${System.currentTimeMillis()}"\n'
              '                )',
              '                Utils.openUri(this, "https://t.me/Vpn_Store21")')

          # 7) auto update + ping
          vm = UI / "main/MainViewModel.kt"
          sub(vm, "                dataSource.syncSubscriptions()\n            } catch (cancelled: CancellationException) {",
              "                dataSource.syncSubscriptions()\n                c21AutoStart()\n            } catch (cancelled: CancellationException) {")
          sub(vm, "            MainAction.TestRealAllServers -> testAllRealPing()",
              "            MainAction.TestRealAllServers -> c21TestEverything()")
          sub(vm, """                        count > 0 -> {
                                      toast(dataSource.getString(R.string.title_import_config_count, count))
                                      setupGroupTab(forceRefresh = true)
                                  }

                                  countSub > 0 -> setupGroupTab(forceRefresh = true)""",
              """                        count > 0 -> {
                                      toast(dataSource.getString(R.string.title_import_config_count, count))
                                      setupGroupTab(forceRefresh = true)
                                      viewModelScope.launch { c21TestEverything() }
                                  }

                                  countSub > 0 -> {
                                      setupGroupTab(forceRefresh = true)
                                      viewModelScope.launch { importConfigViaSub("") }
                                  }""")
          sub(vm, """                    if (result.configCount > 0) {
                                  setupGroupTab(forceRefresh = true)
                                  refreshSelectedGuid()
                              }
          """, """                    if (result.configCount > 0) {
                                  setupGroupTab(forceRefresh = true)
                                  refreshSelectedGuid()
                              }
                              viewModelScope.launch { c21TestEverything() }
          """)
          sub(vm, "    private fun cancelPendingTestResults() {", """    // ---------- Connected21: automatic update and ping ----------
              private var c21Started = false

              private fun c21AutoStart() {
                  if (c21Started) return
                  c21Started = true
                  viewModelScope.launch {
                      val hasSubs = withContext(ioDispatcher) {
                          dataSource.getSubscriptions().any { it.subscription.url.isNotBlank() }
                      }
                      if (hasSubs) importConfigViaSub("") else c21TestEverything()
                  }
              }

              /** Real-ping every server of every subscription, no matter which tab is open. */
              fun c21TestEverything() {
                  val allGuids = com.v2ray.ang.handler.MmkvManager.decodeAllServerList().toList()
                  if (allGuids.isEmpty()) return
                  cancelAllPing()
                  val groupId = uiState.value.selectedGroupId
                  uiState.value.groups.forEach { group ->
                      mutableServerGroupState(group.id).update { current ->
                          current.copy(
                              servers = current.servers.map { server ->
                                  if (server.testDelayMillis == 0L) server
                                  else server.copy(testDelayMillis = 0L)
                              },
                              rows = current.rows.map { row ->
                                  if (row.testDelayMillis == 0L) row
                                  else row.copy(testDelayMillis = 0L)
                              }
                          )
                      }
                  }
                  val request = testRequests.beginBulk(groupId)
                  val message = TestServiceMessage(
                      key = AppConfig.MSG_MEASURE_CONFIG_START,
                      subscriptionId = "",
                      serverGuids = emptyList(),
                      onlyTcp = false
                  )
                  _uiState.update {
                      it.copy(
                          isTesting = true,
                          status = MainStatus.Testing
                      )
                  }
                  bulkTestJob = viewModelScope.launch {
                      withContext(ioDispatcher) {
                          dataSource.clearAllTestDelayResults(allGuids)
                          cacheMutex.withLock { groupDataCache.clear() }
                      }
                      dataSource.sendMsg2TestService(message, request.id)
                  }
              }

              private fun cancelPendingTestResults() {""")

          print("ALL PATCHES APPLIED")
          C21_EOF
          ls -la "$D"

      - name: Apply Connected21 design
        run: python3 /tmp/c21src/apply_c21.py /tmp/c21src

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: c21.jks
          key: connected21-keystore-v1

      - name: Create signing key if missing
        run: |
          if [ ! -f c21.jks ]; then
            keytool -genkeypair -keystore c21.jks -alias connected21 -keyalg RSA -keysize 2048 -validity 36500 -storepass c21store123 -keypass c21store123 -dname "CN=Connected21, O=Connected21, C=IR"
          fi
          ls -la c21.jks

      - name: Build release APK
        working-directory: V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreRelease --no-daemon --console=plain \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/c21.jks" \
            -Pandroid.injected.signing.store.password=c21store123 \
            -Pandroid.injected.signing.key.alias=connected21 \
            -Pandroid.injected.signing.key.password=c21store123 > build.log 2>&1 || {
              grep -n -E "^e: |error:|What went wrong|FAILED|Execution failed" -A6 build.log | head -80
              echo "----- LAST LINES -----"
              tail -40 build.log
              exit 1
            }

      - name: Collect APK files
        run: |
          mkdir -p out
          for f in V2rayNG/app/build/outputs/apk/playstore/release/*.apk; do
            b=$(basename "$f")
            cp "$f" "out/${b/v2rayNG/Connected21}"
          done
          ls -la out

      - name: Publish to Releases (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out/*.apk --title "Connected21 $TAG" --notes "Connected21 APK. For most phones download the file ending with arm64-v8a.apk (or universal.apk if unsure)."

      - name: Backup copy as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connected21-apk
          path: out/*.apk
