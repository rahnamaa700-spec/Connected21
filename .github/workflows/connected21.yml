          /** Colours that slowly drift around the colour wheel. [h] is the base hue in degrees. */
          private fun dynamicHueScheme(h: Float): ColorScheme {
              fun c(dh: Float, s: Float, v: Float): Color =
                  Color.hsv((((h + dh) % 360f) + 360f) % 360f, s, v)
              return darkColorScheme(
                  primary = c(0f, 0.55f, 1f),
                  onPrimary = c(0f, 0.9f, 0.18f),
                  primaryContainer = c(0f, 0.6f, 0.38f),
                  onPrimaryContainer = c(0f, 0.12f, 1f),
                  secondary = c(50f, 0.6f, 1f),
                  onSecondary = c(50f, 0.9f, 0.2f),
                  secondaryContainer = c(50f, 0.7f, 0.32f),
                  onSecondaryContainer = c(50f, 0.15f, 1f),
                  tertiary = c(120f, 0.55f, 1f),
                  onTertiary = c(120f, 0.9f, 0.2f),
                  tertiaryContainer = c(120f, 0.7f, 0.32f),
                  onTertiaryContainer = c(120f, 0.15f, 1f),
                  error = Color(0xFFFF8A80),
                  errorContainer = Color(0xFF93000A),
                  onError = Color(0xFF690005),
                  onErrorContainer = Color(0xFFFFDAD6),
                  background = c(0f, 0.6f, 0.07f),
                  onBackground = c(0f, 0.08f, 0.96f),
                  surface = c(0f, 0.6f, 0.12f),
                  onSurface = c(0f, 0.08f, 0.96f),
                  surfaceVariant = c(0f, 0.5f, 0.25f),
                  onSurfaceVariant = c(0f, 0.15f, 0.85f),
                  outline = c(0f, 0.3f, 0.6f),
                  outlineVariant = c(0f, 0.5f, 0.3f),
