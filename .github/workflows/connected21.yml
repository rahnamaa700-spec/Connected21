          /** How strong the coloured glow behind the main screen is (0 = flat background). */
          val LocalC21GlowAlpha = compositionLocalOf { 1f }

          // Semantic Colors
          val colorPing = Color(0xFF34D399)
          val colorPingRed = Color(0xFFFF5C8A)
