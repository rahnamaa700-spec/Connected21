          @Composable
          private fun C21ConnectButton(
              isRunning: Boolean,
              accent: Color,
              onClick: () -> Unit
          ) {
              val pulse = if (isRunning) {
                  val transition = rememberInfiniteTransition(label = "c21-pulse")
                  transition.animateFloat(
                      initialValue = 0f,
                      targetValue = 1f,
                      animationSpec = infiniteRepeatable(
                          animation = tween(durationMillis = 2400, easing = LinearEasing),
                          repeatMode = RepeatMode.Restart
                      ),
                      label = "c21-pulse-value"
                  ).value
              } else {
                  0f
              }

              val buttonBrush = if (isRunning) {
                  Brush.linearGradient(listOf(Color(0xFF10B981), Color(0xFF22D3EE)))
              } else {
                  Brush.linearGradient(
                      listOf(MaterialTheme.colorScheme.primary, MaterialTheme.colorScheme.secondary)
                  )
              }
              val iconTint = if (isRunning) Color.White else MaterialTheme.colorScheme.onPrimary

              Box(
                  modifier = Modifier.size(116.dp),
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val maxRadius = size.minDimension / 2f
                      drawCircle(
                          brush = Brush.radialGradient(
                              colors = listOf(
                                  accent.copy(alpha = if (isRunning) 0.35f else 0.20f),
                                  Color.Transparent
                              ),
                              center = center,
                              radius = maxRadius
                          ),
                          radius = maxRadius,
                          center = center
                      )
                      if (isRunning) {
                          for (i in 0..1) {
                              val p = (pulse + i * 0.5f) % 1f
                              drawCircle(
                                  color = accent.copy(alpha = (1f - p) * 0.45f),
                                  radius = maxRadius * (0.58f + 0.42f * p),
                                  center = center,
                                  style = Stroke(width = 3.dp.toPx())
                              )
                          }
                      }
                  }
                  Box(
                      modifier = Modifier
                          .size(78.dp)
                          .clip(CircleShape)
                          .background(buttonBrush)
                          .border(2.dp, Color.White.copy(alpha = 0.28f), CircleShape)
                          .clickable(onClick = onClick),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          painter = painterResource(
                              if (isRunning) R.drawable.ic_stop_24dp else R.drawable.ic_play_24dp
