name: Build Connected21 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null || true
          NDKVER="30.0.16248370"
          if echo y | "$SDKM" --channel=0 --install "ndk;$NDKVER" > /tmp/ndk.log 2>&1; then
            echo "NDK_HOME=$ANDROID_HOME/ndk/$NDKVER" >> "$GITHUB_ENV"
            sed -i "s|compileSdk = 37|compileSdk = 37\n    ndkVersion = \"$NDKVER\"|" V2rayNG/app/build.gradle.kts
          else
            tail -20 /tmp/ndk.log
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          fi
          grep -n "ndkVersion" V2rayNG/app/build.gradle.kts || true

      - name: Build VPN tunnel library (libhevtun)
        run: bash compile-hevtun.sh

      - name: Copy tunnel library
        run: cp -r libs V2rayNG/app/

      - name: Download Xray core library (matching version)
        run: |
          TAG=$(cd AndroidLibXrayLite && git describe --tags --abbrev=0 2>/dev/null || true)
          echo "Xray lib tag: $TAG"
          mkdir -p V2rayNG/app/libs
          OUT=V2rayNG/app/libs/libv2ray.aar
          if [ -z "$TAG" ] || ! curl -L -f -o "$OUT" "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar"; then
            echo "tag download failed, using latest"
            curl -L -f -o "$OUT" "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          fi
          ls -la V2rayNG/app/libs

      - name: Write Connected21 design files
        run: |
          D=/tmp/c21src
          mkdir -p "$D"
          cat > "$D/Theme.kt" <<'C21_EOF'
